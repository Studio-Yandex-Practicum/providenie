<!DOCTYPE html>
<html lang="ru">
<head>
    {% include 'header.html' %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            {% include 'admin_sidebar.html' %}
            <main class="col-md-9 ms-sm-auto col-lg-10 px-4">
                <h2>Создать новое сообщение</h2>
                {% include 'web_errors.html' %}
                <form method="post">
                    <div class="mb-3">
                        <label for="text" class="form-label">Текст сообщения</label>
                        <textarea id="text" name="text" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="photos" class="form-label">Фото</label>
                        <input type="file" id="photos" name="photos" class="form-control" multiple>
                    </div>
                    <button type="submit" class="btn btn-primary">Создать сообщение</button>
                </form>
            </main>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    {% include 'footer.html' %}
    
</body>
</html>
