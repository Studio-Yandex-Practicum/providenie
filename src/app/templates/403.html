<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Доступ запрещен</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="error-container">
        <h1>403 - Доступ запрещен</h1>
        <p>Извините, у вас нет доступа к этой странице.</p>
        {% if detail %}
            <p><strong>Подробности ошибки:</strong> {{ detail }}</p>
        {% endif %}
        <p>Авторизуйтесь, пожалуйста, чтобы продолжить.</p>
        <a href="/auth/login">Перейти к авторизации</a>
        <a href="/admin">Вернуться на главную</a>
    </div>
</body>
</html>
