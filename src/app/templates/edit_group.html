{% extends "base.html" %}
{% block title %}Отредактировать группу{% endblock title %}
{% block content %}
<main>
    <div class="d-flex justify-content-center">
        <div class="bg-light p-4 rounded">
            <div>
                <h2 class="my-4">Отредактировать группу</h2>
            </div>
            {% include 'web_errors.html' %}

            <form method="post">
                <input type="hidden" name="_method" value="patch">
                <div class="mb-3">
                    <label for="name" class="form-label lead">Название группы:</label>
                    <input type="text" id="name" name="name" class="form-control container-input" value="{{ group.name }}" required>
                </div>

                <div class="d-flex form-check form-switch form-check-reverse mb-3">
                    <label for="is_active" class="form-check-label lead">Активна</label>
                    <input type="hidden" name="is_active" value="off">
                    <input type="checkbox" id="is_active" name="is_active" value="on" style="width: 50px; margin-left: auto;" class="form-check-input container-input" {% if group.is_active %}checked{% endif %}>
                </div>

                <div class="d-flex mt-4" style="justify-content: space-between;">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="{{ url_for('groups')}}" class="btn btn-secondary">К списку групп</a>
                </div>
            </form>
        <div>
    <div>
</main>

{% endblock content %}
