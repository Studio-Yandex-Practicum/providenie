{% extends "base.html" %}
{% block title %}Неавторизован{% endblock title %}
{% block content %}
<main>
  <div class="error-container">
    <h1>Ошибка 401</h1>
    <p>Вы не авторизованы для доступа к этой странице.</p>
    {% if detail %}
        <p><strong>Подробности ошибки:</strong> {{ detail }}</p>
    {% endif %}
    <a href="{{ url_for('login') }}">Перейти к странице входа</a>
  </div>
</main>
{% endblock content %}
