version: '3.8'
name: providenie

services:
  app:
    build: ../src
    restart: always
    environment:
      - RUN_IN_DOCKER=1
      - TZ=Europe/Moscow
    env_file:
      - ./.env
    volumes:
      - ./logs/:/app/bot/.data/logs/

    depends_on:
      - db

  nginx:
    image: nginx:1.27.3-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8000:80

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      - TZ=Europe/Moscow
    env_file: 
      - path: ./.env
        required: true
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./logs/:/var/log/
    command: ["postgres", "-c", "logging_collector=on", "-c", "log_directory=/var/log", "-c", "log_filename=postgresql.log", "-c", "log_statement=all"]
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
